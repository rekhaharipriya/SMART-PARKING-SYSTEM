<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Parking Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        #logoutBtn {
            background: white;
            color: #2563eb;
            border: none;
            padding: 9px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin-bottom: 5px;
        }

        .welcome p {
            color: #666;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .available {
            color: #16a34a;
        }

        .occupied {
            color: #dc2626;
        }

        .parking-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .parking-section h2 {
            margin-bottom: 20px;
        }

        .slots {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .slot {
            padding: 25px 15px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #ddd;
        }

        .slot.available-slot {
            background: #ecfdf5;
            border-color: #22c55e;
        }

        .slot.occupied-slot {
            background: #fef2f2;
            border-color: #ef4444;
        }

        .slot h3 {
            margin-bottom: 8px;
        }

        .slot-status {
            font-size: 14px;
            margin-bottom: 12px;
        }

        .vehicle-info {
            font-size: 13px;
            margin-bottom: 8px;
        }

        .timer {
            font-weight: bold;
            color: #dc2626;
            margin-bottom: 12px;
        }

        .reserve-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
        }

        .reserve-btn:hover {
            background: #1d4ed8;
        }

        .occupied-btn {
            background: #999;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: not-allowed;
        }

        .history {
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .history h2 {
            margin-bottom: 15px;
        }

        .booking-item {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            line-height: 1.6;
        }

        .active-history {
            color: #16a34a;
            font-weight: bold;
        }

        .expired-history {
            color: #777;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .slots {
                grid-template-columns: repeat(2, 1fr);
            }

            header {
                padding: 15px;
            }
        }

        @media (max-width: 450px) {

            .slots {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

    <header>

        <h1>🚗 Smart Parking</h1>

        <button id="logoutBtn">
            Logout
        </button>

    </header>


    <main class="container">

        <div class="welcome">

            <h2>
                Parking Dashboard
            </h2>

            <p id="userEmail">
                Loading user...
            </p>

        </div>


        <div class="stats">

            <div class="stat-card">

                <h3 id="totalSlots">
                    8
                </h3>

                <p>
                    Total Slots
                </p>

            </div>


            <div class="stat-card">

                <h3
                    id="availableSlots"
                    class="available">
                    8
                </h3>

                <p>
                    Available
                </p>

            </div>


            <div class="stat-card">

                <h3
                    id="occupiedSlots"
                    class="occupied">
                    0
                </h3>

                <p>
                    Occupied
                </p>

            </div>

        </div>


        <section class="parking-section">

            <h2>
                Parking Slots
            </h2>

            <div
                class="slots"
                id="slotsContainer">
            </div>

        </section>


        <section class="history">

            <h2>
                Booking History
            </h2>

            <div id="bookingHistory">

                <p>
                    No bookings yet.
                </p>

            </div>

        </section>

    </main>


    <script type="module">


        /* =========================
           FIREBASE IMPORTS
        ========================= */

        import {
            auth,
            db
        } from "./firebase-config.js";


        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        import {
            collection,
            addDoc,
            serverTimestamp,
            query,
            where,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        /* =========================
           VARIABLES
        ========================= */

        let currentUser = null;

        let occupiedSlots = new Set();

        let activeBookings = [];

        const totalParkingSlots = 8;


        /* =========================
           CHECK LOGIN
        ========================= */

        onAuthStateChanged(auth, (user) => {

            if (!user) {

                window.location.href =
                    "index.html";

                return;
            }


            currentUser = user;


            document.getElementById(
                "userEmail"
            ).textContent =
                "Logged in as: " +
                user.email;


            createSlots();

            loadBookings();

        });


        /* =========================
           LOGOUT
        ========================= */

        document
            .getElementById("logoutBtn")
            .addEventListener(
                "click",
                async () => {

                    await signOut(auth);

                    window.location.href =
                        "index.html";

                }
            );


        /* =========================
           CREATE PARKING SLOTS
        ========================= */

        function createSlots() {

            const container =
                document.getElementById(
                    "slotsContainer"
                );


            container.innerHTML = "";


            for (
                let i = 1;
                i <= totalParkingSlots;
                i++
            ) {

                const slot =
                    document.createElement("div");


                slot.className =
                    "slot available-slot";


                slot.innerHTML = `

                    <h3>
                        Slot ${i}
                    </h3>

                    <p class="slot-status">
                        🟢 Available
                    </p>

                    <button
                        class="reserve-btn"
                        onclick="reserveSlot(${i})">

                        Reserve

                    </button>

                `;


                container.appendChild(slot);

            }

        }


        /* =========================
           LOAD BOOKINGS
        ========================= */

        function loadBookings() {

            const bookingsQuery =
                query(
                    collection(
                        db,
                        "bookings"
                    ),
                    where(
                        "status",
                        "==",
                        "active"
                    )
                );


            onSnapshot(
                bookingsQuery,

                (snapshot) => {

                    occupiedSlots =
                        new Set();

                    activeBookings = [];


                    snapshot.forEach(
                        (doc) => {

                            const booking =
                                doc.data();


                            /*
                             Check whether
                             booking has expired
                            */

                            if (
                                booking.expiresAt &&
                                booking.expiresAt <=
                                Date.now()
                            ) {

                                return;
                            }


                            occupiedSlots.add(
                                Number(
                                    booking.slotNumber
                                )
                            );


                            activeBookings.push(
                                {
                                    id: doc.id,
                                    ...booking
                                }
                            );

                        }
                    );


                    updateSlots();

                    updateStatistics();

                    updateHistory();

                },

                (error) => {

                    console.error(
                        "Firestore error:",
                        error
                    );

                }
            );

        }


        /* =========================
           UPDATE SLOT DISPLAY
        ========================= */

        function updateSlots() {

            const container =
                document.getElementById(
                    "slotsContainer"
                );


            for (
                let i = 1;
                i <= totalParkingSlots;
                i++
            ) {

                const slot =
                    container.children[i - 1];


                if (!slot) {
                    continue;
                }


                const booking =
                    activeBookings.find(
                        (item) =>
                            Number(
                                item.slotNumber
                            ) === i
                    );


                if (booking) {

                    slot.className =
                        "slot occupied-slot";


                    slot.innerHTML = `

                        <h3>
                            Slot ${i}
                        </h3>

                        <p class="slot-status">
                            🔴 Occupied
                        </p>

                        <p class="vehicle-info">
                            🚗 ${booking.vehicleNumber}
                        </p>

                        <p
                            class="timer"
                            id="timer-${i}">

                            Calculating...

                        </p>

                        <button
                            class="occupied-btn"
                            disabled>

                            Occupied

                        </button>

                    `;

                }

                else {

                    slot.className =
                        "slot available-slot";


                    slot.innerHTML = `

                        <h3>
                            Slot ${i}
                        </h3>

                        <p class="slot-status">
                            🟢 Available
                        </p>

                        <button
                            class="reserve-btn"
                            onclick="reserveSlot(${i})">

                            Reserve

                        </button>

                    `;

                }

            }

        }


        /* =========================
           UPDATE STATISTICS
        ========================= */

        function updateStatistics() {

            const occupied =
                occupiedSlots.size;


            const available =
                totalParkingSlots -
                occupied;


            document.getElementById(
                "totalSlots"
            ).textContent =
                totalParkingSlots;


            document.getElementById(
                "availableSlots"
            ).textContent =
                available;


            document.getElementById(
                "occupiedSlots"
            ).textContent =
                occupied;

        }


        /* =========================
           BOOKING HISTORY
        ========================= */

        function updateHistory() {

            const history =
                document.getElementById(
                    "bookingHistory"
                );


            if (
                activeBookings.length === 0
            ) {

                history.innerHTML =
                    "<p>No active bookings yet.</p>";

                return;

            }


            history.innerHTML = "";


            activeBookings.forEach(
                (booking) => {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "booking-item";


                    item.innerHTML = `

                        <strong>
                            Slot ${booking.slotNumber}
                        </strong>

                        <br>

                        Vehicle:
                        ${booking.vehicleNumber}

                        <br>

                        Duration:
                        ${getDurationText(
                            booking.expiresAt
                        )}

                        <br>

                        Status:
                        <span class="active-history">
                            🟢 Active
                        </span>

                    `;


                    history.appendChild(
                        item
                    );

                }
            );

        }


        /* =========================
           DURATION TEXT
        ========================= */

        function getDurationText(
            expiresAt
        ) {

            if (!expiresAt) {
                return "Not available";
            }


            const remaining =
                Math.max(
                    0,
                    expiresAt -
                    Date.now()
                );


            const minutes =
                Math.floor(
                    remaining /
                    (1000 * 60)
                );


            const hours =
                Math.floor(
                    minutes / 60
                );


            const remainingMinutes =
                minutes % 60;


            if (hours > 0) {

                return (
                    hours +
                    " hour " +
                    remainingMinutes +
                    " min remaining"
                );

            }


            return (
                minutes +
                " min remaining"
            );

        }


        /* =========================
           RESERVE SLOT
        ========================= */

        window.reserveSlot =
            async function(slotNumber) {


            /*
             Prevent duplicate booking
            */

            if (
                occupiedSlots.has(
                    slotNumber
                )
            ) {

                alert(
                    "This slot is already occupied."
                );

                return;

            }


            /* Vehicle number */

            const vehicleNumber =
                prompt(
                    "Enter your vehicle number:"
                );


            if (!vehicleNumber) {
                return;
            }


            /* Parking duration */

            const duration =
                prompt(
                    "Enter parking duration in minutes (5-240):"
                );


            if (!duration) {
                return;
            }


            const durationMinutes =
                Number(duration);


            if (
                isNaN(durationMinutes) ||
                durationMinutes < 5 ||
                durationMinutes > 240
            ) {

                alert(
                    "Please enter a duration between 5 and 240 minutes."
                );

                return;

            }


            /*
             Calculate expiry time
            */

            const expiresAt =
                Date.now() +
                (
                    durationMinutes *
                    60 *
                    1000
                );


            try {

                await addDoc(
                    collection(
                        db,
                        "bookings"
                    ),
                    {

                        userId:
                            currentUser.uid,

                        userEmail:
                            currentUser.email,

                        slotNumber:
                            slotNumber,

                        vehicleNumber:
                            vehicleNumber
                                .trim()
                                .toUpperCase(),

                        status:
                            "active",

                        createdAt:
                            serverTimestamp(),

                        expiresAt:
                            expiresAt

                    }
                );


                alert(
                    "Slot " +
                    slotNumber +
                    " reserved successfully!"
                );


            }

            catch (error) {

                console.error(
                    "Booking error:",
                    error
                );


                alert(
                    "Booking failed: " +
                    error.message
                );

            }

        };


        /* =========================
           LIVE COUNTDOWN
        ========================= */

        setInterval(
            () => {

                activeBookings.forEach(
                    (booking) => {

                        const timer =
                            document.getElementById(
                                "timer-" +
                                booking.slotNumber
                            );


                        if (!timer) {
                            return;
                        }


                        const remaining =
                            booking.expiresAt -
                            Date.now();


                        if (
                            remaining <= 0
                        ) {

                            timer.textContent =
                                "Expired";

                            return;

                        }


                        const totalSeconds =
                            Math.floor(
                                remaining /
                                1000
                            );


                        const minutes =
                            Math.floor(
                                totalSeconds /
                                60
                            );


                        const seconds =
                            totalSeconds %
                            60;


                        timer.textContent =
                            "⏱️ " +
                            String(minutes)
                                .padStart(2, "0") +
                            ":" +
                            String(seconds)
                                .padStart(2, "0");

                    }
                );


                /*
                 Refresh slot availability
                 after expiration
                */

                const now =
                    Date.now();


                const expired =
                    activeBookings.some(
                        (booking) =>
                            booking.expiresAt <=
                            now
                    );


                if (expired) {

                    activeBookings =
                        activeBookings.filter(
                            (booking) =>
                                booking.expiresAt >
                                now
                        );


                    occupiedSlots =
                        new Set(
                            activeBookings.map(
                                (booking) =>
                                    Number(
                                        booking.slotNumber
                                    )
                            )
                        );


                    updateSlots();

                    updateStatistics();

                    updateHistory();

                }

            },
            1000
        );


    </script>

</body>

</html>
